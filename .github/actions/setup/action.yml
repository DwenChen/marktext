name: Setup pnpm and Node.js
description: Install pnpm, Node.js, and project dependencies (skips postinstall scripts)

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.21.1'
  package-filter:
    description: Optional pnpm package selector; root tooling is always included
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install Dependencies
      shell: bash
      run: |
        filters=()
        if [ -n "$INSTALL_FILTER" ]; then
          filters=(--filter "$INSTALL_FILTER" --filter .)
        fi
        pnpm install --frozen-lockfile --ignore-scripts "${filters[@]}"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INSTALL_FILTER: ${{ inputs.package-filter }}
