name: Windows Preview Build

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'
          package-filter: 'marktext...'

      - name: Prepare Electron and native modules
        run: pnpm run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_user_agent: 'pnpm'

      - name: Check types, lint, and Markdown unit tests
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm -C packages/desktop exec vitest run test/unit/specs/locale-validation.spec.ts test/unit/specs/application-menu-state.spec.ts test/unit/specs/flush-before-save.spec.ts --maxWorkers=2

      - name: Check Muya lint and GitHub Markdown regression tests
        run: |
          pnpm -C packages/muya lint
          pnpm -C packages/muya exec vitest run src/state/__tests__/githubMarkdown.spec.ts src/state/__tests__/renderToStaticHTML.spec.ts src/state/__tests__/stateToMarkdown.spec.ts --maxWorkers=2
          pnpm -C packages/muya test:spec

      - name: Build Windows installer and ZIP
        run: pnpm run build:win:x64
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify startup and editor changes
        run: >-
          pnpm -C packages/desktop exec playwright test
          test/e2e/launch.spec.ts
          test/e2e/editor-menus-clipboard.spec.ts
          test/e2e/source-mode-flush.spec.ts
          test/e2e/markdown-controls.spec.ts
          test/e2e/github-markdown.spec.ts
          --workers=1

      - name: Record build provenance and checksums
        shell: pwsh
        run: |
          $buildInfo = @{
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            platform = 'win32-x64'
            version = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          }
          $buildInfo | ConvertTo-Json | Set-Content dist/build-info.json -Encoding utf8
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows installer and portable archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: marktext-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/build-info.json
            dist/SHA256SUMS.txt

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-preview-test-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: packages/desktop/test-results/
