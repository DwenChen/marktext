name: Windows Preview Build

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Prepare Electron and native modules
        run: pnpm run postinstall
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_user_agent: 'pnpm'

      - name: Check desktop types and lint
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Check drag handling and toolbar unit tests
        run: |
          pnpm -C packages/muya exec eslint src/block/content/paragraphContent/index.ts src/editor/dragDropImage.ts src/editor/dragDropText.ts src/editor/dragDropState.ts src/editor/standaloneTextDrop.ts src/editor/textDropIndicator.ts src/editor/imageDragSelection.ts src/editor/index.ts src/selection/ImageSelection.ts src/ui/imageToolbar/index.ts src/ui/inlineFormatToolbar/index.ts src/ui/paragraphFrontButton/index.ts src/editor/__tests__/dragDropImage.spec.ts src/editor/__tests__/listImageDrag.spec.ts src/editor/__tests__/imageDragMove.spec.ts src/ui/__tests__/inlineFormatToolbarDrag.spec.ts
          pnpm -C packages/muya exec vitest run src/editor/__tests__/listImageDrag.spec.ts src/editor/__tests__/imageDragMove.spec.ts src/editor/__tests__/dragDropImage.spec.ts src/ui/__tests__/inlineFormatToolbarDrag.spec.ts --maxWorkers=2 --silent

      - name: Compile Electron app
        run: pnpm -C packages/desktop exec electron-vite build

      - name: Verify list and image dragging, offline help, and affected sidebar menus
        run: |
          pnpm -C packages/desktop exec playwright test test/e2e/list-image-drag.spec.ts test/e2e/user-guide.spec.ts --workers=1
          pnpm -C packages/desktop exec playwright test test/e2e/sidebar-menu-layout.spec.ts test/e2e/editor-menus-clipboard.spec.ts -g "sidebar header|sidebar menus preserve" --workers=1

      - name: Build Windows installer and ZIP
        run: pnpm -C packages/desktop exec electron-builder --win --x64 --publish never
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record build provenance and checksums
        shell: pwsh
        run: |
          $buildInfo = @{
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            platform = 'win32-x64'
            version = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          }
          $buildInfo | ConvertTo-Json | Set-Content dist/build-info.json -Encoding utf8
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows installer and portable archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: marktext-windows-x64
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.zip
            dist/build-info.json
            dist/SHA256SUMS.txt

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-preview-test-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: packages/desktop/test-results/
